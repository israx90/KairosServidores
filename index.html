<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Servidor KRS - Gestión de Equipos</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#09090b">
    <link rel="apple-touch-icon" href="logo/logo.png">

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Anti-bot script removed (Obsolete on Vercel) -->

    <!-- Supabase JS Client & BcryptJS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcryptjs.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo/logo.png">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- CropperJS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <!-- jsPDF & AutoTable -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

    <div id="app">
        <!-- Auth Section -->
        <section id="auth-section" class="auth-container">
            <div class="glass"
                style="padding: 40px; border-radius: 20px; text-align: center; width: 100%; max-width: 400px;">
                <div style="margin-bottom: 20px;">
                    <img src="logo/logo.png" alt="KRS Logo" style="width: 80px; height: 80px; object-fit: contain;">
                </div>
                <h2 style="margin-bottom: 30px;">Servidores KRS</h2>

                <form id="login-form">
                    <div class="input-group">
                        <label for="username">Alias / Teléfono</label>
                        <input type="text" id="username" class="form-control"
                            placeholder="Alias (sin espacios) o Teléfono" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <div style="position: relative;">
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-right: 40px; width: 100%; box-sizing: border-box;">
                            <button type="button" id="toggle-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 0; margin: 0; color: var(--text-color); cursor: pointer; font-size: 1.2rem; display: flex; align-items: center;" tabindex="-1">
                                <i class="ph-bold ph-eye" id="eye-icon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
                        Iniciar Sesión <i class="ph-bold ph-arrow-right"></i>
                    </button>
                </form>

                <script>
                    document.getElementById('toggle-password').addEventListener('click', function () {
                        const passwordInput = document.getElementById('password');
                        const eyeIcon = document.getElementById('eye-icon');
                        if (passwordInput.type === 'password') {
                            passwordInput.type = 'text';
                            eyeIcon.classList.remove('ph-eye');
                            eyeIcon.classList.add('ph-eye-slash');
                        } else {
                            passwordInput.type = 'password';
                            eyeIcon.classList.remove('ph-eye-slash');
                            eyeIcon.classList.add('ph-eye');
                        }
                    });
                </script>

                <p style="margin-top: 20px; font-size: 0.8rem; color: var(--text-muted);">
                    ¿Olvidaste tu contraseña? Contacta a tu coordinador.
                </p>
            </div>
        </section>

        <!-- Main Dashboard (Hidden by default) -->
        <section id="dashboard-section" style="display: none;">
            <!-- Mobile Header/Nav -->
            <header class="glass"
                style="position: sticky; top: 0; z-index: 100; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 20px 20px; margin-bottom: 20px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img src="logo/logo.png" alt="KRS" style="width: 36px; height: 36px; object-fit: contain;">
                    <h3 style="margin: 0;">KRS Servidores</h3>
                </div>

                <button id="mobile-menu-btn" class="btn btn-secondary"
                    style="display: none; padding: 8px; border-radius: 8px; margin-left: auto; margin-right: 10px;">
                    <i class="ph-bold ph-list" style="font-size: 24px;"></i>
                </button>



                <div id="user-controls" style="display: none; gap: 10px;">
                    <!-- Theme Toggle -->
                    <button id="theme-toggle-btn" class="btn btn-secondary" style="padding: 8px; border-radius: 50%;">
                        <i class="ph-bold ph-sun" id="theme-icon"></i>
                    </button>
                    <!-- Notification Bell -->
                    <button class="btn btn-secondary" style="padding: 8px; border-radius: 50%;">
                        <i class="ph-bold ph-bell"></i>
                    </button>
                    <!-- User Avatar -->
                    <div id="user-profile-btn" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <span id="user-alias-header" style="font-weight: 600; font-size: 0.95rem; color: #fff;"></span>
                        <div id="user-avatar-btn"
                            style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary-color); display: flex; justify-content: center; align-items: center; overflow: hidden;">
                        </div>
                    </div>
                </div>
                <div id="guest-controls" style="display: none;">
                    <button id="login-redirect-btn" class="btn btn-primary btn-sm">Iniciar Sesión</button>
                    <!-- Login Button for Guests -->
                </div>
            </header>

            <div class="container dashboard-grid">
                <!-- Sidebar Navigation (Desktop) / Bottom Bar (Mobile) -->
                <nav class="sidebar glass">
                    <div class="nav-links"
                        style="display: flex; flex-direction: column; height: 100%; justify-content: space-between;">
                        <div style="display: flex; flex-direction: column; gap: 10px;">
                            <a href="#calendar" class="nav-item btn btn-secondary"
                                style="justify-content: flex-start; border: none;">
                                <i class="ph-bold ph-calendar-blank"></i> <span class="nav-text">Calendario</span>
                            </a>
                            <a href="#teams" class="nav-item btn btn-secondary"
                                style="justify-content: flex-start; border: none;">
                                <i class="ph-bold ph-users-three"></i> <span class="nav-text">Equipos</span>
                            </a>
                            <a href="#assignments" class="nav-item btn btn-secondary"
                                style="justify-content: flex-start; border: none;">
                                <i class="ph-bold ph-clipboard-text"></i> <span class="nav-text">Mis Turnos</span>
                            </a>
                            <a href="#reports" class="nav-item btn btn-secondary"
                                style="justify-content: flex-start; border: none; display: none;">
                                <i class="ph-bold ph-file-pdf"></i> <span class="nav-text">Reportes</span>
                            </a>
                            <!-- User Management (Admin/Coord) -->
                            <a href="#users" class="nav-item btn btn-secondary"
                                style="justify-content: flex-start; border: none; display: none;">
                                <i class="ph-bold ph-users"></i> <span class="nav-text">Usuarios</span>
                            </a>
                            <!-- Admin Panel (Admin Only) -->
                            <a href="#admin" class="nav-item btn btn-secondary"
                                style="justify-content: flex-start; border: none; display: none;">
                                <i class="ph-bold ph-shield-check"></i> <span class="nav-text">Admin Panel</span>
                            </a>
                            <!-- Reminders (Admin/Coordinator Only) -->
                            <a href="#reminders" class="nav-item btn btn-secondary"
                                style="justify-content: flex-start; border: none; display: none;">
                                <i class="ph-bold ph-whatsapp-logo"></i> <span class="nav-text">Recordatorios</span>
                            </a>
                        </div>

                        <div style="margin-top: auto;">
                            <!-- Settings / Logout -->
                            <a href="#settings" class="nav-item btn btn-secondary"
                                style="justify-content: flex-start; border: none; margin-bottom: 10px;">
                                <i class="ph-bold ph-gear"></i> <span class="nav-text">Configuración</span>
                            </a>
                            <button id="logout-btn" class="btn btn-danger"
                                style="width: 100%; justify-content: center;">
                                <i class="ph-bold ph-sign-out"></i> <span class="nav-text">Cerrar Sesión</span>
                            </button>
                        </div>
                    </div>
                </nav>

                <!-- Content Area -->
                <main id="main-content" class="main-content">
                    <!-- Dynamic Content Loaded Here -->
                    <div class="glass"
                        style="padding: 30px; border-radius: 20px; min-height: 400px; display: flex; justify-content: center; align-items: center;">
                        <div style="text-align: center;">
                            <i class="ph-duotone ph-calendar"
                                style="font-size: 64px; color: var(--primary-color); margin-bottom: 20px;"></i>
                            <h2>Panel de Control</h2>
                            <p class="text-muted">Selecciona una opción del menú para comenzar.</p>
                        </div>
                    </div>
                </main>
            </div>
        </section>
        <div id="sidebar-overlay" class="modal-overlay" style="z-index: 999;"></div>
    </div>

    <!-- Main Logic -->
    <script type="module" src="js/app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('SW registered successfully:', registration.scope);
                    })
                    .catch(err => {
                        console.log('SW registration failed:', err);
                    });
            });
        }
    </script>
</body>

</html>
